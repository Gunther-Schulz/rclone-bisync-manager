[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rclone-bisync-manager"
version = "0.4.0b2"
description = "A daemon-based solution for automated, bidirectional synchronization of files using RClone"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
# For AUR: PKGBUILD uses Arch packages (see ARCH_AND_AUR_DEPENDENCIES.md). For pip/GitHub on other distros, these are installed from PyPI.
dependencies = [
    "croniter>=3.0.3",
    "pydantic>=2.8,<3",
    "python_daemon>=3.0.1",
    "PyYAML>=6.0.2",
    "psutil>=5.9.5",
    "Pillow>=10.4.0",
    "PyGObject>=3.46.0",
    "CairoSVG>=2.7.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Sync",
]

[project.scripts]
rclone-bisync-manager = "rclone_bisync_manager.main:main"
rclone-bisync-manager-tray = "rclone_bisync_manager.system_tray:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rclone_bisync_manager"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Gunther-Schulz/rclone-bisync-manager"
"Bug Tracker" = "https://github.com/Gunther-Schulz/rclone-bisync-manager/issues"